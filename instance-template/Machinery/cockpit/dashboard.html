<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cockpit — instance standalone</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--border:#e5e7eb;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:24px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.kpi{font-size:30px;font-weight:700}
.kpi.ok{color:var(--green)}.kpi.bad{color:var(--red)}.kpi.na{color:var(--amber)}
.kpi-lb{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 8px;border-radius:999px}
.b-ok{background:#e7f6ec;color:var(--green)}.b-bad{background:#fdeaea;color:var(--red)}.b-na{background:#fdf3e3;color:var(--amber)}
.sec{margin-bottom:26px}
.meta{color:var(--muted);font-size:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 14px}
button:hover{background:#f9fafb}
#err{color:var(--red);margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cockpit — instance</h1>
  <div class="sub">Observabilité mécanique de l'instance (gates · livrables · santé · spec). <span id="instance" class="meta"></span></div>
  <p id="err"></p>

  <div class="grid" id="kpis"></div>

  <div class="sec card" id="cov"></div>

  <div class="sec">
    <h2 style="font-size:16px">Livrables &amp; gates</h2>
    <div class="card"><table id="liv"><thead><tr><th>Livrable</th><th>Stage</th><th>Verdict</th><th>Ts</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
<script>
async function load(){
  const err=document.getElementById('err'); err.textContent='';
  try {
    const m=await (await fetch('/monitor')).json();
    document.getElementById('instance').textContent='instance: '+(m.instance||'?');
    const s=m.summary||{};
    const k=[
      {lb:'Total livrables', v:s.total??0, cls:s.total?'ok':'na'},
      {lb:'Production gate PASS', v:s.production_gate_pass??0, cls:(s.production_gate_pass?'ok':'na')},
      {lb:'Delivery PASS', v:s.delivery_pass??0, cls:(s.delivery_pass?'ok':'na')},
      {lb:'Provenance PASS', v:s.provenance_pass??0, cls:(s.provenance_pass?'ok':'na')},
    ];
    document.getElementById('kpis').innerHTML=k.map(x=>`<div class="card"><div class="kpi ${x.cls}">${x.v}</div><div class="kpi-lb">${x.lb}</div></div>`).join('');
    const cov=m.coverage||{};
    const cc=cov.core_check||{};
    const mx=cov.matrix||{};
    const covHtml=`<h2 style="font-size:16px">Santé &amp; conformité</h2>
      <table><thead><tr><th>Check</th><th>Resultat</th></tr></thead><tbody>
        <tr><td>core_check (santé universelle)</td><td>${cc.healthy?'<span class="badge b-ok">HEALTHY</span>':(cc.error?'<span class="badge b-bad">ERR</span>':'<span class="badge b-bad">FAIL</span>')} <span class="meta">${cc.healthy?`${cc.pass} PASS / ${cc.fail} FAIL / ${cc.na} NA`:''}${cc.error?' — '+cc.error:''}</span></td></tr>
        <tr><td>Couverure spec</td><td class="meta">${mx.conform??'?'} / ${mx.total??'?'} conformes · ${mx.partiel??0} partiels · ${mx.absent??0} absents</td></tr>
      </tbody></table>`;
    document.getElementById('cov').innerHTML=covHtml;
    const tb=document.querySelector('#liv tbody'); tb.innerHTML='';
    (m.livrables||[]).forEach(l=>{
      const b=l.verdict==='PASS'?'b-ok':(l.verdict==='FAIL'?'b-bad':'b-na');
      tb.insertAdjacentHTML('beforeend',`<tr><td>${l.livrable}</td><td class="meta">${l.stage||''}</td><td><span class="badge ${b}">${l.verdict||''}</span></td><td class="meta num">${(l.ts||'').slice(0,19)}</td></tr>`);
    });
  } catch(e){ err.textContent='Erreur: '+e.message; }
}
load();
</script>
</body>
</html>
